name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # The docs home and /llms.txt bake this origin in at build time; e2e asserts
  # that no localhost URL leaks when it is set.
  NEXT_PUBLIC_BASE_URL: https://uifiles.dev

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:spelling
      - run: pnpm typecheck
      - run: pnpm registry:validate

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # public/r is gitignored; tests/unit/registry.test.ts validates the built
      # output with the CLI's schemas and fails in CI when it is missing.
      - run: pnpm registry:build
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Generated registry files are committed
        run: git diff --exit-code -- registry
      # playwright.config.ts serves the build from `pnpm start` when CI is set.
      - run: pnpm test:e2e
      # Last, so a new advisory on a transitive dependency does not hide a test
      # result; it still fails the job.
      - run: pnpm audit --prod --audit-level=high

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-failure-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            .vitest/attachments
          if-no-files-found: ignore
