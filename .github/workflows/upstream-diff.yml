name: Upstream diff

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-diff
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      # The script imports only node: builtins, so no `pnpm install` is needed.
      # Exit 0: unchanged. 1: an upstream source changed (report it). 2: a
      # source could not be checked (404, other status, network); logged only.
      - name: Compare the lock with upstream
        id: diff
        shell: bash
        run: |
          set +e
          node scripts/sync-upstream.ts > diff.txt 2>&1
          code=$?
          set -e
          cat diff.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream diff (exit $code)"
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ge 2 ]; then
            echo "::warning::sync-upstream could not check every source (exit $code); no issue filed"
          fi
      - if: steps.diff.outputs.code == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const label = 'upstream'
            const diff = fs.readFileSync('diff.txt', 'utf8').replace(/```/g, '` ` `').trim()
            const body = [
              '```',
              diff,
              '```',
              '',
              'Re-port the changed items per docs/porting-ai-elements.md and update registry/ai/upstream.lock.json.',
            ].join('\n')

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '0E8A16',
                description: 'An upstream shadcn/ui or AI Elements source changed',
              })
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 1,
            })
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open[0].number,
                body,
              })
              core.notice(`Commented on the open drift issue #${open[0].number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title: `Upstream drift: ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: [label],
              })
              core.notice(`Opened drift issue #${issue.number}`)
            }
