name: Upstream diff

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: diff
        run: node scripts/sync-upstream.ts | tee diff.txt
        continue-on-error: true
      - if: steps.diff.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = '```\n' + fs.readFileSync('diff.txt', 'utf8') + '```\n\nRe-port the changed items per docs/porting-ai-elements.md and update registry/ai/upstream.lock.json.'
            const title = 'Upstream drift: ' + new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream'] })
